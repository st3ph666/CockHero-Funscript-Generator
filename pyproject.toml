[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cockhero-funscript-generator"
version = "4.15.1"
description = "CockHero funscript generator, optimizer and visual analysis GUI with selectable French/English interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
cockhero-funscript-generator = "cockhero_generator.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
